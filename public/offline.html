<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ZZPers Hub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f7f6f0;
      color: #192e2b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      opacity: 1;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #192e2b;
    }
    p {
      color: #60716b;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #245c4e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .button:hover {
      background: #1c493e;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="icon" src="/icon.svg" alt="ZZPers Hub">
    <h1>Geen internetverbinding</h1>
    <p>
      Geen internetverbinding. Probeer opnieuw.
    </p>
    <a href="/" class="button" onclick="window.location.reload(); return false;">
      Opnieuw laden
    </a>
  </div>
</body>
</html>
