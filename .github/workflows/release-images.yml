name: Release images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: backend, context: backend, file: backend/Dockerfile}
          - {name: worker, context: worker, file: worker/Dockerfile}
          - {name: frontend, context: '.', file: Dockerfile.frontend}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.zzpershub.nl' }}
            VITE_BUILD_VERSION=${{ github.event.workflow_run.head_sha }}
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COMPONENT: ${{ matrix.name }}
          IMAGE: ghcr.io/${{ steps.names.outputs.repository }}/${{ matrix.name }}@${{ steps.image.outputs.digest }}
        run: |
          mkdir digests
          printf '%s' "$DIGEST" > "digests/$COMPONENT.digest"
          if [ "$COMPONENT" = backend ]; then
            docker pull "$IMAGE"
            docker run --rm --entrypoint alembic "$IMAGE" heads | awk '{print $1}' > digests/schema.revision
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*
  bundle:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.zzpershub.nl' }}
        run: python deploy/build_release.py --commit "$COMMIT" --repository "$REPOSITORY" --api-url "$API_URL" --digests digests --output release
      - uses: actions/upload-artifact@v4
        with:
          name: zzpershub-${{ github.event.workflow_run.head_sha }}
          path: release/
          retention-days: 90
