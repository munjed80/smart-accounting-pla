name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build and type check
        run: npm run build

      - name: Frontend tests
        run: npm test

  backend:
    name: Backend smoke + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zzp_test
          POSTGRES_PASSWORD: zzp_test
          POSTGRES_DB: zzp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zzp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZZP_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://zzp_test:zzp_test@localhost:5432/zzp_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend smoke test
        run: bash scripts/backend-smoke.sh

      - name: Backend tests
        run: pytest backend/tests -q
