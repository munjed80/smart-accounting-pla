name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend lint + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build and type check
        run: npm run build

      - name: Frontend tests
        run: npm test

  styles:
    name: Browser CSS + HTML regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:styles
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: style-browser-failures
          path: test-results/

  backend:
    name: Backend smoke + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zzp_test
          POSTGRES_PASSWORD: zzp_test
          POSTGRES_DB: zzp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zzp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZZP_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://zzp_test:zzp_test@localhost:5432/zzp_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend smoke test
        run: bash scripts/backend-smoke.sh

      - name: Backend tests
        run: pytest backend/tests -q

  deployment:
    name: Independent deployment + restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deployment failure and secret-preservation tests
        run: python -m unittest discover -s deploy/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build backend runtime
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: zzp-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build worker runtime
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          load: true
          tags: zzp-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build frontend runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: zzp-frontend:ci
          build-args: VITE_API_URL=https://api.zzp.example
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Real container and restore smoke
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP,PATH python deploy/tests/container_smoke.py
